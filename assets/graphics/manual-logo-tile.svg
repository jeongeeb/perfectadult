<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420">
  <!-- Original logo, clipped before thickening. Insets prevent the expanded edges from being cut off. -->
  <defs>
    <clipPath id="word"><rect x="16" y="16" width="1357" height="334"/></clipPath>
    <filter id="bold" filterUnits="userSpaceOnUse" x="0" y="0" width="1440" height="420">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7.826" result="expanded"/>
      <feFlood flood-color="#000" result="ink"/>
      <feComposite in="ink" in2="expanded" operator="in"/>
    </filter>
  </defs>
  <g filter="url(#bold)">
    <image x="16" y="16" width="2054" height="334" clip-path="url(#word)" href="data:image/webp;base64,"/>
  </g>
</svg>
